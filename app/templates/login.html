{% extends "base.html" %}
{% block title %}Engage2Win — sign in{% endblock %}
{% block body %}
<div class="page">
  <div class="card form-card auth-card">
    <h1 class="title">Sign in</h1>
    <p class="lead">Access your engage2win sessions and map analysis.</p>
    <form method="post" action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <p class="auth-alt">Have an invite code? <a href="{{ url_for('auth.register') }}">Create your account</a>.</p>
  </div>
</div>
{% endblock %}
