<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Engage2Win{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="topbar">
    <a href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='e2open-logo-white.svg') }}" alt="e2open"></a>

  </div>
  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
